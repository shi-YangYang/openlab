name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build

      - name: PyInstaller backend
        run: |
          cd backend
          python -m PyInstaller openlab_backend.spec --noconfirm
        shell: pwsh

      - name: Compile Electron TypeScript
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE\frontend\node_modules\.bin;$env:PATH"
          tsc -p electron/tsconfig.json
        shell: pwsh

      - name: Sync version from tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME.TrimStart("v")
          if ($tag -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$') { throw "Invalid semver in tag '$env:GITHUB_REF_NAME'" }
          npm version $tag --no-git-tag-version --allow-same-version

      - name: electron-builder
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.electron-builder-cache
        run: |
          npx electron-builder --win --publish never 2>&1 | Tee-Object -FilePath electron-builder-log.txt
          exit $LASTEXITCODE
        shell: pwsh

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-builder-log
          path: electron-builder-log.txt

      - name: Generate release notes
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $tag = $env:GITHUB_REF_NAME
          $prev = git -c i18n.logOutputEncoding=utf-8 describe --tags --abbrev=0 "$tag^" 2>$null
          $range = if ($prev) { "$prev..$tag" } else { $tag }
          $log = @(git -c i18n.logOutputEncoding=utf-8 log --pretty=format:"- %s" $range | Where-Object { $_ })
          $lines = @("## Commits in $tag", "")
          if ($log.Count -gt 0) { $lines += $log } else { $lines += "- (no commits)" }
          Set-Content -Path release-notes.txt -Value $lines -Encoding utf8NoBOM
          Get-Content release-notes.txt

      - name: Remove old release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $json = gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json assets 2>$null
          if ($LASTEXITCODE -eq 0 -and $json) {
            foreach ($a in ($json | ConvertFrom-Json).assets) {
              Write-Host "Deleting stale asset: $($a.name)"
              gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$($a.id)"
            }
          } else {
            Write-Host "No existing release for $env:GITHUB_REF_NAME; skip cleanup"
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          body_path: release-notes.txt
          files: frontend/dist_electron/*.exe
