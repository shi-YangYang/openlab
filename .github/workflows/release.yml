name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build

      - name: PyInstaller backend
        run: |
          cd backend
          python -m PyInstaller openlab_backend.spec --noconfirm
        shell: pwsh

      - name: Compile Electron TypeScript
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE\frontend\node_modules\.bin;$env:PATH"
          tsc -p electron/tsconfig.json
        shell: pwsh

      - name: electron-builder
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npx electron-builder --win

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: frontend/dist_electron/*.exe
